name: vtu_app
description: A complete VTU business application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  shimmer: ^3.0.0
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.1
  
  provider: ^6.1.1
  go_router: ^13.0.1
  
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  intl: ^0.19.0
  connectivity_plus: ^5.0.2
  url_launcher: ^6.2.4
  path_provider: ^2.1.1
  
  email_validator: ^2.1.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/