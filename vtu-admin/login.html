<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #1a237e, #283593); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: Arial; }
        .login-box { background: white; padding: 40px; border-radius: 16px; width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        h2 { text-align: center; margin-bottom: 30px; color: #1a237e; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        button { width: 100%; padding: 14px; background: #1a237e; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #283593; }
        .error { color: red; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>VTU Admin Login</h2>
        <input type="text" id="username" placeholder="Username or Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p class="error" id="error"></p>
    </div>
    <script>
        async function login() {
            const identifier = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const res = await fetch('http://localhost:5000/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier, password })
            });
            const data = await res.json();
            if (data.success && data.user.role === 'admin') {
                localStorage.setItem('adminToken', data.token);
                window.location.href = 'index.html';
            } else {
                document.getElementById('error').textContent = 'Invalid admin credentials';
            }
        }
    </script>
</body>
</html>
